<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
    <title>PULSE7 Catalog — Web Component smoke test</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      /*
        Deliberately hostile host styles, standing in for the shell and the Lit
        microfrontend. None of them may reach inside <pulse7-catalog>.
      */
      * {
        font-family: serif;
      }

      button {
        background: purple;
        color: white;
        border: 4px dashed orange;
      }

      a {
        color: red;
      }

      h1 {
        font-size: 10px;
      }

      input {
        border: 4px solid magenta;
      }

      .host-probe {
        padding: 16px;
        border-bottom: 2px solid #ccc;
      }
    </style>
  </head>
  <body>
    <div class="host-probe">
      <h1>Host page heading</h1>
      <button type="button">Host page button</button>
      <a href="#">Host page link</a>
      <input placeholder="Host page input" />
      <p>The row above must stay ugly. Everything below it must not.</p>
    </div>

    <pulse7-catalog></pulse7-catalog>
    <script type="module" src="./dist/pulse7-catalog.js"></script>
  </body>
</html>
